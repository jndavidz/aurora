# NAS 本地构建 local-toolfix 镜像用 compose
# 部署到 /volume2/docker/aurora/,由 scripts/deploy_nas.sh 重命名为 docker-compose.yml
# 与官方 docker-compose.yml(ghcr 镜像)并存,避免覆盖
version: '3'

services:
  app:
    image: aurora:local-toolfix        # 本地构建 tag,不用官方 ghcr 镜像
    container_name: aurora
    restart: unless-stopped
    build:                             # ← 必须有 build 段,否则 --build 被静默忽略
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct   # 国内构建加速;CI 不传则用默认 proxy.golang.org
    working_dir: /work                  # 命中 local-toolfix 的 ./.runtime/tokens 隔离目录(见 §二)
    ports:
      - '65432:8080'
    environment:
      - SERVER_HOST=0.0.0.0      # 默认即 0.0.0.0(config.go:33),显式声明确保局域网可达
      - SERVER_PORT=8080
      - Authorization=david
      - FREE_ACCOUNTS=false     # 代码默认 false;env.template 写 true 是模板值,生产保持关
      - TOOL_CALLING_ENABLED=true   # local-toolfix 工具调用修复总开关
      - REFUSAL_RETRIES=1       # pi 场景:普通对话不带 <tool_call> 时立即返回,不重试(ZCode 场景才需 5)
      - DEBUG_TOOL_LOG=/work/.runtime/logs/tool_debug.log   # 工具调用 trace,local-toolfix 专属
      # DeepSeek 网页逆向通道(见 docs/DEEPSEEK.md)。token 放 tokens/deepseek_tokens.txt,
      # 只读挂载到 /work/.runtime/tokens/;路径硬编码(部署脚本会清 .env,勿用 ${} 间接)。
      - DEEPSEEK_WEB_TOKENS=/work/.runtime/tokens/deepseek_tokens.txt
      - DEEPSEEK_MODELS=${DEEPSEEK_MODELS:-}
      - DEEPSEEK_WEB_BASE=${DEEPSEEK_WEB_BASE:-https://chat.deepseek.com}
      - DEEPSEEK_PROXY=${DEEPSEEK_PROXY:-}
      # 智谱清言(chatglm.cn)网页逆向通道。token 放 tokens/glm_tokens.txt(每行一个
      # chatglm_refresh_token),只读挂载;仅当文件非空时 Glm provider 注册。
      - GLM_WEB_TOKENS=/work/.runtime/tokens/glm_tokens.txt
      - GLM_MODELS=${GLM_MODELS:-}
      - GLM_WEB_BASE=${GLM_WEB_BASE:-https://chatglm.cn}
      - GLM_PROXY=${GLM_PROXY:-}
      # 千问(www.qianwen.com)网页逆向通道。token 放 tokens/qianwen_tokens.txt(每行一个
      # tongyi_sso_ticket),只读挂载;仅当文件非空时 Qianwen provider 注册。
      - QIANWEN_WEB_TOKENS=/work/.runtime/tokens/qianwen_tokens.txt
      - QIANWEN_MODELS=${QIANWEN_MODELS:-}
      - QIANWEN_WEB_BASE=${QIANWEN_WEB_BASE:-https://chat2.qianwen.com}
      - QIANWEN_PROXY=${QIANWEN_PROXY:-}
      # Grok(grok.com)网页逆向通道。cookie 池放 tokens/grok_cookies.txt(每行
      # uid|cookie 串),只读挂载;仅当文件非空时 Grok provider 注册。
      - GROK_COOKIES=/work/.runtime/tokens/grok_cookies.txt
      - GROK_MODELS=${GROK_MODELS:-}
      # 腾讯元宝(yuanbao.tencent.com)网页逆向通道 —— 【已关停,2026-08-14】
      # 两个账号(主号+小号)一天内先后被风控冻结,元宝网页端对非浏览器调用极敏感,
      # 结构性封号风险,不值得继续消耗账号。代码与 docs/YUANBAO.md 保留,
      # 恢复需:取消本段注释 + 提供新 token 到 tokens/yuanbao_tokens.txt。
      # - YUANBAO_WEB_TOKENS=/work/.runtime/tokens/yuanbao_tokens.txt
      # - YUANBAO_MODELS=${YUANBAO_MODELS:-}
      # - YUANBAO_WEB_BASE=${YUANBAO_WEB_BASE:-https://yuanbao.tencent.com}
      # - YUANBAO_AGENT_ID=${YUANBAO_AGENT_ID:-naQivTmsDa}
      # - YUANBAO_PROXY=${YUANBAO_PROXY:-}
    volumes:
      - /volume2/docker/aurora/tokens:/work/.runtime/tokens:ro   # token 只读,命中 tokenFilePath 隔离目录
      - /volume2/docker/aurora/logs:/work/.runtime/logs          # 调试日志(可选)
