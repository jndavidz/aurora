# NUC squeezelite 主单元覆盖（权威副本 → /etc/systemd/system/squeezelite.service.d/override.conf）
#
# 2026-08-30 初版：加大缓冲 + 钉死 playerid
# 2026-09-21 改：输出设备切 USB DAC（Topping DX3 Pro+）+ 声明速率范围
#
# 1) -b 8192:16384：加大内部 stream/output 缓冲（默认 2048:3445 KB），
#    万一 ML 推理与播放重叠时给足抗抖动余量，避免 buffer underrun 爆音。
# 2) -m 00:00:00:00:00:00：钉死 playerid。
#    未指定 -m 时本版本 squeezelite 会用网卡 MAC 注册，导致重启后 playerid 变化，
#    而 HA 的 lms_nuc_play/nuc_tts 写死的是 00:00:00:00:00:00，会打到离线的僵尸条目上。
#    钉死后 playerid 可预测，与 deploy/ha 现有配置一致。
# 3) -o hw:CARD=Pro,DEV=0：USB DAC 直出（ALSA 硬件直出 = bit-perfect）。
#    2026-09-21 DAC 到货切换：原值 hw:CARD=PCH,DEV=0（板载 ALC283）。
#    用 CARD 名而非卡号（cardN 会随枚举顺序漂移：本次 DAC 为 card1，HDMI 被挤到 card2）。
# 4) -r 44100-768000：显式声明 DAC 支持的速率范围（实测 44.1k~768k 全速率可打开）。
#    DAC 断电/未连接时 squeezelite 起不来会静默失效；显式声明后设备后到也能打开。
#    依据 architecture-runbook.md T5.5b；回退=删本项恢复原状。
# 5) -D：启用 DSD 输出。
#    ⛔ **不需要装 LMS 的 DSDPlayer 插件**（2026-09-21 对照实验结论，反社区通行建议）。
#    原因：LMS 9.x 的 /lms/convert.conf 已内置 `dff dff * *` / `dsf dsf * *`
#    = 原样直传（规则内容是单个 `-`），squeezelite 自带 dsd codec 自行解码。
#    对照实验：插件启用时 DFF 正常播；**禁用并删除插件后仍正常播** → 插件无作用。
#    默认不带参数 = DoP 封装（ALSA 呈 S32_LE/176400），实测 DAC 屏显 DSD，bit-perfect。
#    若需 native（ALSA 呈 DSD_U32_BE/88200）可写 -D :u32be（DX3 Pro+ 支持，Altset 3 DOP=0）。
#    判据=功放/DAC 屏显 DSD 而非 44.1/PCM。
[Service]
ExecStart=
ExecStart=/usr/bin/squeezelite -n NUC-HiFi -s 10.10.10.2 -o hw:CARD=Pro,DEV=0 -a 80:4:: -b 8192:16384 -m 00:00:00:00:00:00 -r 44100-768000 -D -C 5
